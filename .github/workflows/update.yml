name: Update turnout (all states)

# Pulls the latest county turnout data for each tracked state and commits it
# when it changes. Sources refresh only a few times a day, so most 10-minute
# runs detect "no change" and commit nothing, keeping git history clean.
#
# After a state's 2026 general results are certified, scripts/freeze.py archives
# that state (data/<st>/final_2026_general.json), stamps its latest.json as
# frozen, and drops a data/<st>/_frozen.json marker so its fetch is skipped from
# then on. Once every state is frozen it writes data/_frozen_all.json and the
# gate step below makes all later runs no-op. See config/freeze.json.

on:
  schedule:
    # Backup only: GitHub delays (and often drops) scheduled runs under load, so
    # the 10-minute cadence comes from the timer chain (tick.yml, started by the
    # last step below). Slow sources throttle themselves
    # (common.checked_recently), so late or extra runs are harmless.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}       # allow manual runs from the Actions tab
  push:                       # a code/config change (e.g. a newly wired state) runs it right away
    branches: [main]
    paths: ["scripts/**", "config/**", ".github/workflows/update.yml"]
  workflow_run:               # self-heal: a timer run that failed (e.g. never got a runner) restarts the chain
    workflows: ["Update timer (10-min chain)"]
    types: [completed]

permissions:
  contents: write
  actions: write    # to start the next run via the timer chain (tick.yml)

jobs:
  update:
    # timer runs that succeeded (they start the next update themselves) or were
    # skipped don't trigger an update; failed / cancelled / timed-out ones do
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    # one update at a time; on the job so skipped workflow_run runs never take
    # (or bump) a place in line
    concurrency:
      group: update-fl
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate on freeze (stop once all states are certified & archived)
        id: gate
        run: |
          if [ -f data/_frozen_all.json ]; then
            echo "frozen=1" >> "$GITHUB_OUTPUT"
            echo "All tracked states are frozen/archived — this run will do nothing."
          else
            echo "frozen=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape Election-Day county turnout (GA/TX)
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/eday_scrape.py || echo "eday scrape failed (non-fatal)"

      - name: Fetch & process all state turnout (health-tracked)
        if: steps.gate.outputs.frozen != '1'
        run: |
          pip install --quiet pypdf || true
          python scripts/run_all_states.py || echo "state runner failed (non-fatal)"

      - name: Update VA locality early votes (about hourly; self-throttled)
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/va_locality_update.py || echo "va locality update failed (non-fatal)"

      - name: Update FL district vote-by-mail (prior-day tables; self-throttled)
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/fl_districts_update.py || echo "fl districts update failed (non-fatal)"

      - name: Update election results (House / Senate / Governor)
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/results_update.py || echo "results update failed (non-fatal)"

      - name: Update county-level result margins (turnout-vs-result)
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/results_county_update.py || echo "county results update failed (non-fatal)"

      - name: Build status manifest
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/build_status.py || echo "status build failed (non-fatal)"

      - name: Update voter registration by party
        if: steps.gate.outputs.frozen != '1'
        run: |
          pip install --quiet pypdf || true
          python scripts/registration_update.py || echo "registration update failed (non-fatal)"

      - name: Build daily summary
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/build_summary.py || echo "summary build failed (non-fatal)"

      - name: Post alerts (only if ALERT_WEBHOOK secret is set)
        if: steps.gate.outputs.frozen != '1'
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: python scripts/post_alerts.py || echo "alerts failed (non-fatal)"

      - name: Freeze & archive states whose results are certified
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/freeze.py || echo "freeze step failed (non-fatal)"

      - name: Commit if data changed
        if: steps.gate.outputs.frozen != '1'
        run: |
          git config user.name  "turnout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data change; nothing to commit."
          else
            ts=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Turnout update $ts"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Schedule the next run (~10 min) via the timer chain
        if: always() && steps.gate.outputs.frozen != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one chain only: skip if a timer is already waiting/running
          active=$(gh run list --repo "${{ github.repository }}" --workflow tick.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length' || echo 0)
          if [ "$active" = "0" ]; then
            gh workflow run tick.yml --repo "${{ github.repository }}" --ref main
          else
            echo "A timer is already pending; not starting another."
          fi
