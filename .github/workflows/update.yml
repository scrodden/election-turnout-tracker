name: Update turnout (all states)

# Pulls the latest county turnout data for each tracked state and commits it
# when it changes. Sources refresh only a few times a day, so most 10-minute
# runs detect "no change" and commit nothing, keeping git history clean.
#
# After a state's 2026 general results are certified, scripts/freeze.py archives
# that state (data/<st>/final_2026_general.json), stamps its latest.json as
# frozen, and drops a data/<st>/_frozen.json marker so its fetch is skipped from
# then on. Once every state is frozen it writes data/_frozen_all.json and the
# gate step below makes all later runs no-op. See config/freeze.json.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay under load)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-fl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate on freeze (stop once all states are certified & archived)
        id: gate
        run: |
          if [ -f data/_frozen_all.json ]; then
            echo "frozen=1" >> "$GITHUB_OUTPUT"
            echo "All tracked states are frozen/archived — this run will do nothing."
          else
            echo "frozen=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape Election-Day county turnout (GA/TX)
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/eday_scrape.py || echo "eday scrape failed (non-fatal)"

      - name: Fetch & process all state turnout (health-tracked)
        if: steps.gate.outputs.frozen != '1'
        run: |
          pip install --quiet pypdf || true
          python scripts/run_all_states.py || echo "state runner failed (non-fatal)"

      - name: Update election results (House / Senate / Governor)
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/results_update.py || echo "results update failed (non-fatal)"

      - name: Update county-level result margins (turnout-vs-result)
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/results_county_update.py || echo "county results update failed (non-fatal)"

      - name: Build status manifest
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/build_status.py || echo "status build failed (non-fatal)"

      - name: Update voter registration by party
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/registration_update.py || echo "registration update failed (non-fatal)"

      - name: Build daily summary
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/build_summary.py || echo "summary build failed (non-fatal)"

      - name: Post alerts (only if ALERT_WEBHOOK secret is set)
        if: steps.gate.outputs.frozen != '1'
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: python scripts/post_alerts.py || echo "alerts failed (non-fatal)"

      - name: Freeze & archive states whose results are certified
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/freeze.py || echo "freeze step failed (non-fatal)"

      - name: Commit if data changed
        if: steps.gate.outputs.frozen != '1'
        run: |
          git config user.name  "turnout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data change; nothing to commit."
          else
            ts=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Turnout update $ts"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
