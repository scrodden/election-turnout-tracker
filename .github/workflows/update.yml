name: Update turnout (all states)

# Pulls the latest county turnout data for each tracked state and commits it
# when it changes. Sources refresh only a few times a day, so most 10-minute
# runs detect "no change" and commit nothing, keeping git history clean.
#
# After a state's 2026 general results are certified, scripts/freeze.py archives
# that state (data/<st>/final_2026_general.json), stamps its latest.json as
# frozen, and drops a data/<st>/_frozen.json marker so its fetch is skipped from
# then on. Once every state is frozen it writes data/_frozen_all.json and the
# gate step below makes all later runs no-op. See config/freeze.json.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay under load)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-fl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate on freeze (stop once all states are certified & archived)
        id: gate
        run: |
          if [ -f data/_frozen_all.json ]; then
            echo "frozen=1" >> "$GITHUB_OUTPUT"
            echo "All tracked states are frozen/archived — this run will do nothing."
          else
            echo "frozen=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and process Florida turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/fl/_frozen.json ]; then echo "FL frozen — skipping"; else python scripts/fl_update.py; fi

      - name: Fetch and process North Carolina turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/nc/_frozen.json ]; then echo "NC frozen — skipping"; else python scripts/nc_update.py || echo "NC update failed (non-fatal)"; fi

      - name: Fetch and process Nevada turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/nv/_frozen.json ]; then echo "NV frozen — skipping"; else python scripts/nv_update.py || echo "NV update failed (non-fatal)"; fi

      - name: Fetch and process Pennsylvania turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/pa/_frozen.json ]; then echo "PA frozen — skipping"; else python scripts/pa_update.py || echo "PA update failed (non-fatal)"; fi

      - name: Fetch and process Virginia turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/va/_frozen.json ]; then echo "VA frozen — skipping"; else python scripts/va_update.py || echo "VA update failed (non-fatal)"; fi

      - name: Fetch and process Colorado turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/co/_frozen.json ]; then echo "CO frozen — skipping"; else python scripts/co_update.py || echo "CO update failed (non-fatal)"; fi

      - name: Fetch and process Louisiana turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/la/_frozen.json ]; then echo "LA frozen — skipping"; else pip install --quiet pypdf && python scripts/la_update.py || echo "LA update failed (non-fatal)"; fi

      - name: Fetch and process Washington turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/wa/_frozen.json ]; then echo "WA frozen — skipping"; else python scripts/wa_update.py || echo "WA update failed (non-fatal)"; fi

      - name: Freeze & archive states whose results are certified
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/freeze.py || echo "freeze step failed (non-fatal)"

      - name: Commit if data changed
        if: steps.gate.outputs.frozen != '1'
        run: |
          git config user.name  "turnout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data change; nothing to commit."
          else
            ts=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Turnout update $ts"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
