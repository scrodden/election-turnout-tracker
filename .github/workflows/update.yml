        run: |
          if [ -f data/pa/_frozen.json ]; then echo "PA frozen — skipping"; else python scripts/pa_update.py || echo "PA update failed (non-fatal)"; fi

      - name: Fetch and process Virginia turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/va/_frozen.json ]; then echo "VA frozen — skipping"; else python scripts/va_update.py || echo "VA update failed (non-fatal)"; fi

      - name: Fetch and process Colorado turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/co/_frozen.json ]; then echo "CO frozen — skipping"; else python scripts/co_update.py || echo "CO update failed (non-fatal)"; fi

      - name: Fetch and process Louisiana turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/la/_frozen.json ]; then echo "LA frozen — skipping"; else pip install --quiet pypdf && python scripts/la_update.py || echo "LA update failed (non-fatal)"; fi

      - name: Fetch and process Washington turnout
