name: Update turnout (all states)

# Pulls the latest county turnout data for each tracked state and commits it
# when it changes. Sources refresh only a few times a day, so most 10-minute
# runs detect "no change" and commit nothing, keeping git history clean.
#
# After a state's 2026 general results are certified, scripts/freeze.py archives
# that state (data/<st>/final_2026_general.json), stamps its latest.json as
# frozen, and drops a data/<st>/_frozen.json marker so its fetch is skipped from
# then on. Once every state is frozen it writes data/_frozen_all.json and the
# gate step below makes all later runs no-op. See config/freeze.json.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay under load)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-fl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate on freeze (stop once all states are certified & archived)
        id: gate
        run: |
          if [ -f data/_frozen_all.json ]; then
            echo "frozen=1" >> "$GITHUB_OUTPUT"
            echo "All tracked states are frozen/archived — this run will do nothing."
          else
            echo "frozen=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape Election-Day county turnout (GA/TX)
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/eday_scrape.py || echo "eday scrape failed (non-fatal)"

      - name: Fetch and process Florida turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/fl/_frozen.json ]; then echo "FL frozen — skipping"; else python scripts/fl_update.py; fi

      - name: Fetch and process North Carolina turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/nc/_frozen.json ]; then echo "NC frozen — skipping"; else python scripts/nc_update.py || echo "NC update failed (non-fatal)"; fi

      - name: Fetch and process Nevada turnout
        if: steps.gate.outputs.frozen != '1'
        run: |
          if [ -f data/nv/_frozen.json ]; then echo "NV frozen — skipping"; else python scripts/nv_update.py || echo "NV update failed (non-fatal)"; fi

      - name: Fetch and process Pennsylvania turnout
