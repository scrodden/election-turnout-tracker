name: VA locality early-vote (dataset watch)

# Virginia early votes by locality. There is no official public locality feed,
# and VPAP's per-locality pages block automated access, so we no longer scrape
# them. scripts/va_locality_update.py instead watches for VPAP's public S3
# dataset of locality early votes (it published one for the April referendum)
# and, once a November one exists, rebuilds data/va/locality.json from it with
# turnout against VA ELECT's registered-voter counts. Until then it records
# "waiting" and the page keeps its per-locality links to VPAP.
#
# Cheap (a few HEAD requests to S3, at most a few VPAP page views when looking
# for a new visual), so it runs every 3 hours.

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: va-locality
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stop if all states are frozen/archived
        id: gate
        run: |
          if [ -f data/_frozen_all.json ]; then echo "frozen=1" >> "$GITHUB_OUTPUT"; else echo "frozen=0" >> "$GITHUB_OUTPUT"; fi

      - name: Update VA locality early votes
        if: steps.gate.outputs.frozen != '1'
        run: python scripts/va_locality_update.py || echo "va locality update failed (non-fatal)"

      - name: Commit if locality data changed
        if: steps.gate.outputs.frozen != '1'
        run: |
          git config user.name  "turnout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/va/locality.json data/va/registered.json
          if git diff --cached --quiet; then
            echo "No VA locality change; nothing to commit."
          else
            ts=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "VA locality early-vote update $ts"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
