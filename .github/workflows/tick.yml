name: Update timer (10-min chain)

# GitHub's cron is best-effort and has been firing the 10-minute schedule only
# every few hours, so the updates chain themselves: each "Update turnout" run
# ends by starting this workflow, whose job waits on the `update-timer`
# environment (an 8-minute wait timer set in the repo's Settings -> Environments;
# no runner is used while it waits) and then starts the next update run.
# On Election Day it also starts the 2-minute live-results loop each cycle.
#
# Self-healing: if an update run ends without success (e.g. GitHub couldn't
# assign a runner during an Actions incident, so its last step never ran), the
# workflow_run trigger restarts the chain, unless another update or timer run
# is already queued or running. The mirror case (a timer run that fails) is
# handled by update.yml's own workflow_run trigger; GitHub caps workflow_run
# chains at three levels, and update.yml's cron stays the last resort. The chain stops once every state is frozen
# (update.yml's gate).

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Update turnout (all states)"]
    types: [completed]

permissions:
  actions: write

jobs:
  check:
    # only for restarts: a run that finished without success
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          busy=$(gh run list --repo "$R" --workflow update.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')
          ticks=$(gh run list --repo "$R" --workflow tick.yml --limit 10 --json databaseId,status \
                    --jq '[.[] | select(.status != "completed" and .databaseId != ${{ github.run_id }})] | length')
          if [ "$busy" = "0" ] && [ "$ticks" = "0" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
            echo "Restarting the chain after a '${{ github.event.workflow_run.conclusion }}' run of '${{ github.event.workflow_run.name }}'."
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
            echo "Chain still alive (updates pending: $busy, timers pending: $ticks)."
          fi

  tick:
    needs: check
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.go == '1') }}
    runs-on: ubuntu-latest
    environment: update-timer
    # one timer at a time; on the job (not the workflow) so restart checks that
    # skip never queue behind, or bump, a real timer
    concurrency:
      group: update-timer
      cancel-in-progress: false
    steps:
      - name: Start the next update run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update.yml --repo "${{ github.repository }}" --ref main
          D=$(date -u +%Y-%m-%d)
          if [ "$D" = "2026-11-03" ] || [ "$D" = "2026-11-04" ]; then
            gh workflow run results_eday.yml --repo "${{ github.repository }}" --ref main
          fi
