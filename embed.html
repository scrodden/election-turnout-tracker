<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Embed</title>
<link rel="stylesheet" href="style.css" />
<style>
  html, body { background: transparent; }
  body { margin: 0; padding: 10px; }
  .w { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); font-family: inherit; }
  .w h3 { margin: 0 0 8px; font-size: 15px; }
  .bar { position: relative; height: 24px; border-radius: 6px; overflow: hidden; display: flex; background: var(--line); }
  .row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 8px; }
  .big { font-size: 26px; font-weight: 800; }
  .k { color: var(--muted); font-size: 12px; }
  a.credit { color: var(--muted); font-size: 11px; text-decoration: none; display: block; margin-top: 8px; }
</style>
</head>
<body>
<div id="embed" class="w">Loading…</div>
<script src="embed.js"></script>
</body>
</html>
